name: Digital Sansad member sync

on:
  schedule:
    # Weekly on Sunday at 07:00 UTC (12:30 IST).
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write safe additive/enrichment changes to Supabase (otherwise dry-run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: digital-sansad-member-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and sync public member profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/digital_sansad/requirements.txt

      - name: Install importer dependencies
        run: python -m pip install -r scripts/digital_sansad/requirements.txt

      - name: Run importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply }}" == "true" ]]; then
            python scripts/digital_sansad/import_members.py --apply --report digital-sansad-import-report.json
          else
            python scripts/digital_sansad/import_members.py --report digital-sansad-import-report.json
          fi

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-sansad-import-report-${{ github.run_id }}
          path: digital-sansad-import-report.json
          if-no-files-found: warn
          retention-days: 90
