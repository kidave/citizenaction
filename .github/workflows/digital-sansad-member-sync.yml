name: Digital Sansad member sync

on:
  pull_request:
    paths:
      - "scripts/digital_sansad/**"
      - ".github/workflows/digital-sansad-member-sync.yml"
  schedule:
    # Weekly on Sunday at 07:00 UTC (12:30 IST).
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply a single-member live test (requires member_id; otherwise dry-run)"
        required: true
        default: false
        type: boolean
      member_id:
        description: "Digital Sansad MPS number for the single-member live test"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: digital-sansad-member-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and sync public member profiles
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/digital_sansad/requirements.txt

      - name: Install importer dependencies
        run: python -m pip install -r scripts/digital_sansad/requirements.txt

      - name: Validate importer syntax
        run: python -m py_compile scripts/digital_sansad/import_members.py scripts/digital_sansad/publish_report.py

      - name: Run importer unit tests
        run: python -m unittest scripts.digital_sansad.test_import_members -v

      - name: Run importer (read-only dry-run on same-repository PRs)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply }}" == "true" ]]; then
            MEMBER_ID="${{ inputs.member_id }}"
            if [[ -z "$MEMBER_ID" ]]; then
              echo "ERROR: member_id is required for a live test. No writes were performed."
              exit 2
            fi
            python scripts/digital_sansad/import_members.py --apply --member-id "$MEMBER_ID" --report digital-sansad-import-report.json
          else
            # Pull requests and scheduled runs are read-only previews unless an operator
            # explicitly opts into apply on a manual workflow dispatch.
            python scripts/digital_sansad/import_members.py --report digital-sansad-import-report.json
          fi

      - name: Publish report to Supabase
        if: success() && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/digital_sansad/publish_report.py digital-sansad-import-report.json

      - name: Upload import report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-sansad-import-report-${{ github.run_id }}
          path: digital-sansad-import-report.json
          if-no-files-found: warn
          retention-days: 90
