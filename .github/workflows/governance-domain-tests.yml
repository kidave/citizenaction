name: Governance Domain Tests

on:
  push:
    branches:
      - feature/governance-domains-routing-v2
    paths:
      - "src/utils/governance.js"
      - "src/utils/governance.domains.test.js"
      - "vitest.config.js"
      - ".github/workflows/governance-domain-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/utils/governance.js"
      - "src/utils/governance.domains.test.js"
      - "vitest.config.js"
      - ".github/workflows/governance-domain-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Governance domain route tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run governance domain tests
        run: npx vitest run --project unit
