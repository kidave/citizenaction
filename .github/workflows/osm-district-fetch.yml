name: Fetch OSM Districts and Boundaries

on:
  workflow_dispatch:
    inputs:
      state:
        description: "State/UT name, or all"
        required: false
        default: "all"
        type: string
      attempts:
        description: "Maximum endpoint-rotation attempts (1-4)"
        required: false
        default: "2"
        type: string
      delay_seconds:
        description: "Delay between Overpass requests and retry rounds"
        required: false
        default: "3"
        type: string
      geometry_batch_size:
        description: "Relations per geometry request (1-25)"
        required: false
        default: "10"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: osm-district-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-districts:
    name: Discover districts and export OSM boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate fetcher syntax
        run: python -m py_compile scripts/fetch-osm-districts.py scripts/sync-osm-districts.py

      - name: Restore latest completed OSM dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/osm-districts-baseline
          BASELINE_RUN_ID="$(gh run list --workflow osm-district-fetch.yml --branch main --status completed --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$BASELINE_RUN_ID" ]; then
            echo "Restoring OSM baseline from latest completed main-branch run $BASELINE_RUN_ID"
            gh run download "$BASELINE_RUN_ID" --dir artifacts/osm-districts-baseline
            if ! find artifacts/osm-districts-baseline -type f -name india-osm-districts.json -print -quit | grep -q .; then
              echo "::error::The restored artifact does not contain the OSM district dataset."
              exit 1
            fi
          else
            echo "No completed main-branch OSM dataset found; establishing the initial baseline."
          fi

      - name: Fetch district relations and boundary geometry
        env:
          STATE: ${{ inputs.state || 'all' }}
          ATTEMPTS: ${{ inputs.attempts || '2' }}
          DELAY_SECONDS: ${{ inputs.delay_seconds || '3' }}
          GEOMETRY_BATCH_SIZE: ${{ inputs.geometry_batch_size || '10' }}
        run: |
          BASELINE_ARGS=()
          if find artifacts/osm-districts-baseline -type f -name india-osm-districts.json -print -quit | grep -q .; then
            BASELINE_ARGS+=(--baseline-dir artifacts/osm-districts-baseline)
          fi
          python scripts/sync-osm-districts.py \
            --state "$STATE" \
            --attempts "$ATTEMPTS" \
            --delay-seconds "$DELAY_SECONDS" \
            --geometry-batch-size "$GEOMETRY_BATCH_SIZE" \
            "${BASELINE_ARGS[@]}" \
            --output-dir artifacts/osm-districts

      - name: Upload raw responses and review datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-district-sync-${{ github.run_number }}
          path: artifacts/osm-districts/
          if-no-files-found: error
          retention-days: 30
